    <circle cx="860.1" cy="407" r="25.5" fill="#FBF3F6" opacity="0.85"/><circle cx="852.4" cy="399.4" r="8.9" fill="#FFFFFF" opacity="0.24"/>
    <circle cx="646.5" cy="391" r="17.7" fill="#FBF3F6" opacity="0.85"/><circle cx="641.2" cy="385.6" r="6.2" fill="#FFFFFF" opacity="0.24"/>
