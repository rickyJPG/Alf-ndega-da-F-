<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F4F0"/>
      <stop offset="55%" stop-color="#EDE9E2"/>
      <stop offset="100%" stop-color="#DDD6CB"/>
    </linearGradient>
    <radialGradient id="vinheta" cx="50%" cy="42%" r="78%">
