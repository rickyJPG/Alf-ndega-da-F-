<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B84A0"/>
      <stop offset="55%" stop-color="#6E6784"/>
      <stop offset="100%" stop-color="#4E4A62"/>
    </linearGradient>
    <radialGradient id="vinheta" cx="50%" cy="42%" r="78%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="desfoque" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="20.4"/>
    </filter>
    <filter id="medio" x="-30%" y="-30%" width="160%" height="160%">
