name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixa a data dos dados de exemplo, para que testes com prazos sejam
  # reproduzíveis (consultas públicas, vagas de atendimento, risco de incêndio).
  MOCK_TODAY: '2026-07-25'

jobs:
  qualidade:
    name: Tipos, lint e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm run test

  acessibilidade:
    name: Acessibilidade e percursos (Playwright + axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar o browser
        run: npx playwright install --with-deps chromium

      - name: Compilar
        run: npm run build

      - name: Testes de ponta a ponta
        run: npx playwright test

      - name: Guardar relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  desempenho:
    name: Orçamento de desempenho (Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

      - name: Guardar relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
